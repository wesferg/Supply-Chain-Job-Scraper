# ---------------------------------------------------------------------------
# Companies to watch. Only `name` is required.
#
# Hints that help the first-run discovery (all are validated before use):
#   url:          a Workday careers URL  (https://<tenant>.wdN.myworkdayjobs.com/<site>)
#   careers_url:  the company's own careers page; scanned for ATS links
#   slugs:        likely board names to try on Greenhouse/Lever/Ashby/Workday
#   ats + ids:    exact, e.g. {ats: greenhouse, token: simplisafe}
#
# Whatever is found is cached in data/resolved.json. Companies that can't be
# resolved are listed in the run log; retry is automatic after 7 days.
#
# Not supported (own custom sites): Apple, Google, Tesla, Amazon, Meta. Check those by hand.
# ---------------------------------------------------------------------------
companies:

name: Job scout

# One job does everything: finds companies (first run, then weekly), checks every board,
# ranks all matches into JOBS.md, and opens an issue when there are new ones.
on:
  schedule:
    - cron: "43 14 * * *"   # daily, ~6:43am Pacific (7:43 during daylight time)
  workflow_dispatch:         # "Run workflow" button for an on-demand run

permissions:
  contents: write   # commit JOBS.md, results/ and data/ back to the repo
  issues: write     # daily issue with new matches (phone notification via the GitHub app)

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Find and rank jobs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: Claude fit scoring
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}           # optional: web-search company discovery
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m jobscout

      - name: Save results
        if: always()
        run: |
          git config user.name "job-scout"
          git config user.email "job-scout@users.noreply.github.com"
          git add JOBS.md data results 2>/dev/null || git add data results
          git diff --cached --quiet || git commit -m "Job scout $(date -u +%Y-%m-%d)"
          git push
